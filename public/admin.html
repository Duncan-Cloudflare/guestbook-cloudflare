<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav>
    <a href="/">&larr; Back to guestbook</a>
  </nav>

  <header>
    <h1>Moderation</h1>
    <p>Approve, reject, or delete messages.</p>
  </header>

  <div id="message" class="message"></div>

  <section class="card">
    <label for="admin-secret">Admin secret</label>
    <input type="password" id="admin-secret" placeholder="Enter admin secret">
    <button id="load-btn" class="secondary">Load entries</button>
  </section>

  <section class="card">
    <h2>Pending & Approved Entries</h2>
    <div id="entries">Enter your secret and click Load entries.</div>
  </section>

  <script src="/admin.js"></script>
</body>
</html>
