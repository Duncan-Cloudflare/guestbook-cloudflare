<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Guestbook</h1>
    <p>Leave a message. <a href="/admin.html">Admin</a></p>
  </header>

  <div id="message" class="message"></div>

  <section class="card">
    <form id="guestbook-form">
      <input type="text" name="name" placeholder="Your name" required maxlength="100">
      <textarea name="message" placeholder="Your message" required maxlength="1000" rows="4"></textarea>
      <button type="submit">Sign Guestbook</button>
    </form>
  </section>

  <section class="card">
    <h2>Messages</h2>
    <div id="entries">Loading...</div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
